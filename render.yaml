services:
  - type: web
    name: hospital-management
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # لا تضبط DATA_DIR إلا إذا أضفت قرصًا دائمًا (disks) كما في الأسفل.
      # بدون قرص، تُعاد قاعدة البيانات لأصلها عند إعادة النشر على الخطة المجانية.

# =========================================================
#  لتخزين قاعدة البيانات بشكل دائم على Render (يتطلب خطة مدفوعة):
#  أزل التعليق عن الأسطر التالية ثم أضف DATA_DIR=/data في envVars
# ---------------------------------------------------------
